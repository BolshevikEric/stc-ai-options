<div id="stc-chat-options-settings" class="stc-co-settings">
    <div class="stc-co-settings-header">
        <i class="fa-solid fa-sliders"></i>
        <span>聊天选项设置</span>
    </div>

    <div class="stc-co-block">
        <label class="checkbox_label" for="stc-co-enabled">
            <input id="stc-co-enabled" type="checkbox" />
            <span>启用聊天末尾选项框</span>
        </label>
    </div>

    <div class="stc-co-block">
        <div class="stc-co-block-title">
            <i class="fa-solid fa-wand-magic-sparkles"></i>
            <span>AI 选项生成</span>
        </div>
        <label class="checkbox_label" for="stc-co-auto">
            <input id="stc-co-auto" type="checkbox" />
            <span>AI 回复后自动生成选项</span>
        </label>
        <div class="stc-co-field-row">
            <span>生成数量(1–8)</span>
            <input id="stc-co-gen-count" class="text_pole" type="number" min="1" max="8" step="1" />
        </div>
        <textarea id="stc-co-gen-prompt" class="text_pole stc-co-gen-prompt" rows="9" placeholder="生成指令模板"></textarea>
    </div>

    <div class="stc-co-block">
        <div class="stc-co-block-title">
            <i class="fa-solid fa-palette"></i>
            <span>插件主题</span>
        </div>
        <select id="stc-co-ui-theme" class="text_pole">
            <option value="auto">跟随酒馆主题</option>
            <option value="dark">深色</option>
            <option value="light">浅色</option>
        </select>
    </div>

    <div class="stc-co-block">
        <div class="stc-co-block-title">
            <i class="fa-solid fa-plug"></i>
            <span>AI API(扩展自身调用)</span>
        </div>
        <div class="stc-co-radio-row">
            <label class="checkbox_label">
                <input type="radio" name="stc-co-api-mode" value="main" />
                <span>跟随酒馆主 API</span>
            </label>
            <label class="checkbox_label">
                <input type="radio" name="stc-co-api-mode" value="custom" />
                <span>自定义 API</span>
            </label>
        </div>
        <div id="stc-co-custom-fields" class="stc-co-fields" style="display:none">
            <input id="stc-co-api-url" class="text_pole" type="text" placeholder="API 地址,如 https://api.example.com/v1" autocomplete="off" />
            <input id="stc-co-api-key" class="text_pole" type="password" placeholder="API Key" autocomplete="new-password" />
            <input id="stc-co-api-model" class="text_pole" type="text" placeholder="模型名,如 gpt-4o-mini" autocomplete="off" />
            <div class="stc-co-test-row">
                <button id="stc-co-test-btn" class="menu_button">
                    <i class="fa-solid fa-vial"></i>
                    <span>测试连接</span>
                </button>
            </div>
        </div>
    </div>

    <div class="stc-co-block">
        <div class="stc-co-block-title">
            <i class="fa-solid fa-unlock-keyhole"></i>
            <span>破限词注入</span>
        </div>
        <label class="checkbox_label" for="stc-co-jb-enabled">
            <input id="stc-co-jb-enabled" type="checkbox" />
            <span>启用破限词注入</span>
        </label>
        <textarea id="stc-co-jb-text" class="text_pole stc-co-jb-text" rows="6" placeholder="输入破限词内容…"></textarea>
        <div class="stc-co-depth-row">
            <span>注入深度(越大越靠顶部,默认 999)</span>
            <input id="stc-co-jb-depth" class="text_pole" type="number" min="1" max="10000" step="1" />
        </div>
    </div>
</div>
