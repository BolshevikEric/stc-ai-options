<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>STC 聊天选项 — 生成方向按钮 预览</title>
<style>
/* ===================== 预览页框架(非插件样式) ===================== */
* { box-sizing: border-box; }
body {
    margin: 0;
    font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
    background: #0b0b10;
    color: #ddd;
    min-height: 100vh;
}
.preview-header {
    max-width: 860px;
    margin: 0 auto;
    padding: 18px 16px 8px;
}
.preview-header h1 { font-size: 1.05em; margin: 0 0 4px; }
.preview-header p { font-size: 0.8em; opacity: 0.65; margin: 0 0 12px; line-height: 1.6; }
.preview-header b { color: #9ec1ff; }
.toolbar {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 10px;
}
.toolbar .grp {
    display: flex;
    gap: 0;
    border: 1px solid #333;
    border-radius: 8px;
    overflow: hidden;
}
.toolbar button {
    background: #1a1a22;
    color: #ccc;
    border: none;
    padding: 6px 12px;
    font-size: 0.78em;
    cursor: pointer;
    border-right: 1px solid #333;
}
.toolbar button:last-child { border-right: none; }
.toolbar button:hover { background: #26262f; }
.toolbar button.on { background: #35507a; color: #fff; }
.statusbar {
    font-size: 0.75em;
    opacity: 0.6;
    line-height: 1.7;
    margin-bottom: 12px;
}
.statusbar b { color: #7aa2f7; }

/* ===================== 聊天舞台(模拟酒馆 #chat) ===================== */
#stage {
    max-width: 760px;
    margin: 0 auto 40px;
    min-height: 480px;
    border-radius: 12px;
    padding: 16px 10px 12px;
    container-type: inline-size;
    transition: max-width 0.25s ease;
}
#stage.sim-pc   { max-width: 760px; }
#stage.sim-phone{ max-width: 400px; }
#stage.sim-auto { max-width: 92vw; }

/* 深色主题舞台 */
body.t-dark #stage { background: linear-gradient(180deg, #15151b, #101014); }
body.t-dark .bubble-ai  { background: #1e1e26; border: 1px solid rgba(255,255,255,0.07); }
body.t-dark .bubble-user{ background: #2c3a55; border: 1px solid rgba(122,162,247,0.25); }
/* 浅色主题舞台 */
body.t-light { background: #c9c9d2; color: #222; }
body.t-light #stage { background: #ececf1; }
body.t-light .preview-header { color: #333; }
body.t-light .preview-header h1 { color: #222; }
body.t-light .preview-header b { color: #2c4a80; }
body.t-light .toolbar button { background: #fff; color: #444; }
body.t-light .toolbar .grp { border-color: #ccc; }
body.t-light .toolbar button { border-right-color: #ccc; }
body.t-light .toolbar button:hover { background: #eee; }
body.t-light .toolbar button.on { background: #35507a; color: #fff; }
body.t-light .statusbar { opacity: 0.8; }
body.t-light .statusbar b { color: #2c4a80; }
body.t-light .bubble-ai  { background: #fff; border: 1px solid rgba(0,0,0,0.1); }
body.t-light .bubble-user{ background: #cfe0ff; border: 1px solid rgba(53,80,122,0.3); }

.bubble {
    max-width: 82%;
    margin: 0 0 10px;
    padding: 9px 12px;
    border-radius: 10px;
    font-size: 0.84em;
    line-height: 1.65;
}
.bubble-ai { border-top-left-radius: 3px; }
.bubble-user { margin-left: auto; border-top-right-radius: 3px; }
.bubble .who { font-size: 0.78em; font-weight: 600; opacity: 0.55; display: block; margin-bottom: 3px; }

/* ================================================================
   以下为插件选项框样式(与 style.css 改造方案一致,可直接移植)
   ================================================================ */
#stc-chat-options-bar {
    /* 主题变量:默认跟随酒馆(此处演示深色值) */
    --stc-bg: rgba(23, 23, 29, 0.96);
    --stc-border: rgba(255, 255, 255, 0.12);
    --stc-fg: #e8e8ec;
    --stc-hover: rgba(255, 255, 255, 0.45);
    --stc-num-bg: rgba(255, 255, 255, 0.08);
    --stc-num-border: rgba(255, 255, 255, 0.16);
    --stc-danger: #f08080;

    display: flex;
    flex-direction: column;
    gap: 6px;
    width: min(680px, calc(100% - 20px));
    margin: 8px auto;
    padding: 0;
}
body.t-light #stc-chat-options-bar {
    --stc-bg: rgba(250, 250, 252, 0.97);
    --stc-border: rgba(0, 0, 0, 0.16);
    --stc-fg: #26262c;
    --stc-hover: rgba(0, 0, 0, 0.45);
    --stc-num-bg: rgba(0, 0, 0, 0.06);
    --stc-num-border: rgba(0, 0, 0, 0.18);
    --stc-danger: #d63031;
}

/* 选项卡片 */
#stc-chat-options-bar .stc-co-btn {
    display: flex;
    align-items: center;
    gap: 9px;
    width: 100%;
    min-height: 36px;
    padding: 7px 11px;
    border-radius: 9px;
    color: var(--stc-fg);
    background: var(--stc-bg);
    border: 1px solid var(--stc-border);
    cursor: pointer;
    user-select: none;
    text-align: left;
    transition: border-color 0.15s ease, filter 0.15s ease;
}
#stc-chat-options-bar .stc-co-btn:hover { border-color: var(--stc-hover); filter: brightness(1.08); }
#stc-chat-options-bar .stc-co-num {
    flex-shrink: 0;
    width: 20px; height: 20px;
    border-radius: 6px;
    display: flex; align-items: center; justify-content: center;
    font-size: 0.72em;
    opacity: 0.85;
    background: var(--stc-num-bg);
    border: 1px solid var(--stc-num-border);
}
#stc-chat-options-bar .stc-co-main {
    flex: 1; min-width: 0;
    font-size: 0.86em;
    line-height: 1.4;
    word-break: break-word;
}

/* 状态行(生成中 / 失败 / 入口) */
#stc-chat-options-bar .stc-co-state {
    display: flex;
    align-items: center;
    gap: 8px;
    min-height: 32px;
    padding: 6px 11px;
    border-radius: 9px;
    font-size: 0.8em;
    opacity: 0.85;
    color: var(--stc-fg);
    background: var(--stc-bg);
    border: 1px dashed var(--stc-border);
}
#stc-chat-options-bar .stc-co-error {
    color: var(--stc-danger);
    opacity: 1;
    cursor: pointer;
    border-style: solid;
}
#stc-chat-options-bar .stc-co-entry { cursor: pointer; justify-content: center; }
#stc-chat-options-bar .stc-co-entry:hover { border-color: var(--stc-hover); filter: brightness(1.08); opacity: 1; }

/* ── 新增:88 / 12 并排容器 ── */
#stc-chat-options-bar .stc-co-pair {
    display: flex;
    align-items: stretch;
    gap: 6px;
}
#stc-chat-options-bar .stc-co-pair .stc-co-main-btn { flex: 88 1 0; min-width: 0; }
#stc-chat-options-bar .stc-co-pair .stc-co-dir     { flex: 12 1 0; min-width: 0; }

/* ── 新增:生成方向按钮 ── */
#stc-chat-options-bar .stc-co-dir {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 5px;
    min-height: 32px;
    padding: 6px 8px;
    border-radius: 9px;
    font-size: 0.72em;
    opacity: 0.85;
    color: var(--stc-fg);
    background: var(--stc-bg);
    border: 1px dashed var(--stc-border);
    cursor: pointer;
    user-select: none;
    white-space: nowrap;
    overflow: hidden;
    transition: border-color 0.15s ease, filter 0.15s ease;
}
#stc-chat-options-bar .stc-co-dir:hover { border-color: var(--stc-hover); filter: brightness(1.08); opacity: 1; }
#stc-chat-options-bar .stc-co-dir.active { border-style: solid; border-color: var(--stc-hover); opacity: 1; }
#stc-chat-options-bar .stc-co-dir .stc-co-dir-text { overflow: hidden; text-overflow: ellipsis; }

/* ── 新增:内嵌方向输入行 ── */
#stc-chat-options-bar .stc-co-dir-row {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 6px 8px;
    border-radius: 9px;
    background: var(--stc-bg);
    border: 1px solid var(--stc-border);
}
#stc-chat-options-bar .stc-co-dir-input {
    flex: 1;
    min-width: 0;
    background: var(--stc-num-bg);
    color: var(--stc-fg);
    border: 1px solid var(--stc-border);
    border-radius: 7px;
    padding: 5px 9px;
    font-size: 0.8em;
    font-family: inherit;
    outline: none;
}
#stc-chat-options-bar .stc-co-dir-input:focus { border-color: var(--stc-hover); }
#stc-chat-options-bar .stc-co-dir-input::placeholder { color: var(--stc-fg); opacity: 0.35; }
#stc-chat-options-bar .stc-co-dir-act {
    flex-shrink: 0;
    width: 28px; height: 28px;
    border-radius: 7px;
    display: flex; align-items: center; justify-content: center;
    background: var(--stc-num-bg);
    color: var(--stc-fg);
    border: 1px solid var(--stc-border);
    cursor: pointer;
    font-size: 0.85em;
    user-select: none;
}
#stc-chat-options-bar .stc-co-dir-act:hover { border-color: var(--stc-hover); filter: brightness(1.1); }
#stc-chat-options-bar .stc-co-dir-act.ok { color: #58d68d; }
#stc-chat-options-bar .stc-co-dir-act.no { color: var(--stc-danger); }

/* 换一批 */
#stc-chat-options-bar .stc-co-refresh {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    padding: 6px 8px;
    border-radius: 9px;
    font-size: 0.72em;
    opacity: 0.5;
    cursor: pointer;
    user-select: none;
    color: var(--stc-fg);
    background: var(--stc-bg);
    border: 1px dashed transparent;
    transition: opacity 0.15s ease;
}
#stc-chat-options-bar .stc-co-refresh:hover { opacity: 1; }

/* 生成中 spinner */
.stc-spin {
    width: 13px; height: 13px;
    border: 2px solid var(--stc-border);
    border-top-color: var(--stc-fg);
    border-radius: 50%;
    animation: stcspin 0.8s linear infinite;
    flex-shrink: 0;
}
@keyframes stcspin { to { transform: rotate(360deg); } }

/* ── 手机端窄屏(真实页面用 @media (max-width:768px),预览用容器查询模拟) ── */
@container (max-width: 480px) {
    #stc-chat-options-bar { width: calc(100% - 10px); gap: 5px; }
    #stc-chat-options-bar .stc-co-pair .stc-co-main-btn { min-height: 40px; }
    #stc-chat-options-bar .stc-co-pair .stc-co-dir { min-height: 40px; padding: 6px; }
    #stc-chat-options-bar .stc-co-dir .stc-co-dir-text { display: none; } /* 只留图标 */
    #stc-chat-options-bar .stc-co-btn { padding: 8px 10px; gap: 8px; min-height: 40px; }
    #stc-chat-options-bar .stc-co-main { font-size: 0.84em; }
    #stc-chat-options-bar .stc-co-dir-input { min-height: 34px; font-size: 0.9em; }
    #stc-chat-options-bar .stc-co-dir-act { width: 36px; height: 36px; }
    #stc-chat-options-bar .stc-co-dir-row { padding: 5px 6px; }
}
</style>
</head>
<body class="t-dark">

<div class="preview-header">
    <h1>🧭 「生成方向」按钮效果预览</h1>
    <p>
        底部为模拟的聊天选项框:主按钮宽度 88%,右侧新增 12% 宽的「生成方向」按钮。
        点击「生成方向」在选项框内展开输入行,回车或点 ✓ 确认后<b>立即按方向生成</b>;
        留空确认 = 清除方向。「换一批」沿用当前方向。
    </p>
    <div class="toolbar">
        <div class="grp" id="grpView">
            <button data-view="pc" class="on">PC 宽度</button>
            <button data-view="phone">手机宽度</button>
            <button data-view="auto">跟随窗口</button>
        </div>
        <div class="grp" id="grpTheme">
            <button data-theme="dark" class="on">深色主题</button>
            <button data-theme="light">浅色主题</button>
        </div>
        <div class="grp">
            <button id="btnError">模拟生成失败</button>
            <button id="btnClearDir">清除方向</button>
        </div>
    </div>
    <div class="statusbar" id="status"></div>
</div>

<div id="stage" class="sim-pc">
    <div class="bubble bubble-ai">
        <span class="who">Seraphina</span>
        她的手指在门框上停了停,又收了回去。窗外传来更夫敲梆的余音,一声,又一声。<br>
        「……你真的决定要去了?」她没有回头,声音轻得几乎被烛火吞没。
    </div>
    <div class="bubble bubble-user">
        <span class="who">你</span>
        我把斗篷搭上肩头,「天亮之前,我一定回来。」
    </div>

    <!-- 选项框(由 JS 渲染) -->
    <div id="stc-chat-options-bar"></div>
</div>

<script>
/* ======== 模拟 renderBar 逻辑(与 index.js 改造方案一致) ======== */
const bar = document.getElementById('stc-chat-options-bar');
const statusEl = document.getElementById('status');

const state = {
    phase: 'entry',      // entry | generating | done | error
    direction: '',       // 当前生成方向
    editing: false,      // 方向输入行是否展开
    options: [],
    error: '',
};

const ICON_WAND = '<svg viewBox="0 0 24 24" width="13" height="13" fill="currentColor" aria-hidden="true"><path d="M2.7 21.3a1.2 1.2 0 0 1 0-1.7L13.2 9.1l1.7 1.7L4.4 21.3a1.2 1.2 0 0 1-1.7 0z"/><path d="M18.5 2l.9 2.6 2.6.9-2.6.9-.9 2.6-.9-2.6-2.6-.9 2.6-.9z"/><path d="M15.5 12.5l.6 1.7 1.7.6-1.7.6-.6 1.7-.6-1.7-1.7-.6 1.7-.6z"/></svg>';
const ICON_COMPASS = '<svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="9.5"/><path d="M15.8 8.2l-2.3 5.3-5.3 2.3 2.3-5.3z" fill="currentColor" stroke="none"/></svg>';
const ICON_RETRY = '<svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.34-5.66"/><path d="M20 3v4h-4"/></svg>';

const FAKE_OPTIONS = {
    suspense: ['追问项链的来历', '暗中跟踪她今晚的去向', '翻看她留下的旧信件', '假装熟睡,观察动静', '去问更夫昨晚看见了什么'],
    romance: ['替她把斗篷系好', '握住她微凉的手', '轻声说:等我回来', '临行前抱她一下', '允诺带她一同离开'],
    action: ['吹灭蜡烛,潜出门去', '从后窗翻出院墙', '抄起门边的短刀', '反锁房门拖延时间', '大声呼喊引来巡夜人'],
    generic: ['问她到底在担心什么', '安慰她后转身出门', '询问城门今夜是否开放', '先去马厩牵马备鞍', '留下来,暂时不走'],
};

function pickFakeOptions() {
    const d = state.direction;
    if (/悬疑|真相|秘密|调查|追查|跟踪/.test(d)) return FAKE_OPTIONS.suspense;
    if (/感情|浪漫|温柔|表白|安慰|亲/.test(d)) return FAKE_OPTIONS.romance;
    if (/战斗|逃跑|行动|刺激|冒险|危险/.test(d)) return FAKE_OPTIONS.action;
    return FAKE_OPTIONS.generic;
}

function esc(t) {
    return String(t).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

/* 主按钮行 + 方向按钮 → 并排容器 */
function buildPair(mainHtml, mainClass) {
    const pair = document.createElement('div');
    pair.className = 'stc-co-pair';
    const main = document.createElement('div');
    main.className = mainClass + ' stc-co-main-btn';
    main.innerHTML = mainHtml;
    const dir = document.createElement('div');
    dir.className = 'stc-co-dir' + (state.direction ? ' active' : '');
    dir.title = state.direction ? `当前方向:${state.direction}` : '设置本次生成选项的方向';
    dir.innerHTML = ICON_COMPASS + '<span class="stc-co-dir-text">生成方向</span>';
    dir.addEventListener('click', () => { state.editing = !state.editing; render(); });
    pair.appendChild(main);
    pair.appendChild(dir);
    return pair;
}

function buildDirInputRow() {
    const row = document.createElement('div');
    row.className = 'stc-co-dir-row';
    row.innerHTML = `
        <input class="stc-co-dir-input" type="text" maxlength="200"
            placeholder="输入生成方向,如:往悬疑方向…(留空清除)"
            value="${esc(state.direction)}" />
        <div class="stc-co-dir-act ok" title="确认:保存方向并立即生成">✓</div>
        <div class="stc-co-dir-act no" title="取消">✕</div>`;
    const input = row.querySelector('.stc-co-dir-input');
    const confirm = () => {
        const v = input.value.trim();
        state.direction = v;
        state.editing = false;
        if (v) { generate(); } else { render(); }
    };
    row.querySelector('.ok').addEventListener('click', confirm);
    row.querySelector('.no').addEventListener('click', () => { state.editing = false; render(); });
    input.addEventListener('keydown', e => {
        if (e.key === 'Enter') confirm();
        if (e.key === 'Escape') { state.editing = false; render(); }
    });
    requestAnimationFrame(() => input.focus());
    return row;
}

function buildOptionRow(seq, text) {
    const el = document.createElement('div');
    el.className = 'stc-co-btn';
    el.innerHTML = `<div class="stc-co-num">${seq}</div><div class="stc-co-main">${esc(text)}</div>`;
    el.addEventListener('click', () => alert('【演示】点击选项 → 填入酒馆输入框:\n' + text));
    return el;
}

function render() {
    bar.innerHTML = '';
    state.editing = state.editing && state.phase !== 'generating';

    if (state.phase === 'generating') {
        const row = document.createElement('div');
        row.className = 'stc-co-state';
        row.innerHTML = '<span class="stc-spin"></span><span>正在生成选项…</span>';
        bar.appendChild(row);
        updateStatus();
        return;
    }

    if (state.phase === 'error') {
        const pair = buildPair(
            `<span style="color:var(--stc-danger)">生成失败:${esc(state.error)},点击重试</span>`,
            'stc-co-state stc-co-error');
        pair.querySelector('.stc-co-main-btn').addEventListener('click', generate);
        bar.appendChild(pair);
        if (state.editing) bar.appendChild(buildDirInputRow());
        updateStatus();
        return;
    }

    if (state.phase === 'entry') {
        const pair = buildPair(ICON_WAND + '<span>生成选项</span>', 'stc-co-state stc-co-entry');
        pair.querySelector('.stc-co-main-btn').addEventListener('click', generate);
        bar.appendChild(pair);
        if (state.editing) bar.appendChild(buildDirInputRow());
        updateStatus();
        return;
    }

    // done:选项卡片 + 换一批 + 生成方向
    state.options.forEach((t, i) => bar.appendChild(buildOptionRow(i + 1, t)));
    const pair = buildPair(ICON_RETRY + '<span>换一批</span>', 'stc-co-refresh');
    pair.querySelector('.stc-co-main-btn').addEventListener('click', generate);
    bar.appendChild(pair);
    if (state.editing) bar.appendChild(buildDirInputRow());
    updateStatus();
}

function generate() {
    if (state.phase === 'generating') return;
    state.phase = 'generating';
    render();
    setTimeout(() => {
        state.phase = 'done';
        state.options = pickFakeOptions().slice(0, 4);
        render();
    }, 1100);
}

function updateStatus() {
    statusEl.innerHTML =
        `状态:<b>${ {entry:'未生成', generating:'生成中', done:'已生成', error:'生成失败'}[state.phase] }</b> · ` +
        `当前方向:<b>${ state.direction ? esc(state.direction) : '(未设置)' }</b> · ` +
        `注入提示词:<b>${ state.direction ? '请围绕以下方向生成选项:' + esc(state.direction) : '(无方向附加)' }</b>`;
}

/* ======== 工具栏 ======== */
document.getElementById('grpView').addEventListener('click', e => {
    const btn = e.target.closest('button'); if (!btn) return;
    document.querySelectorAll('#grpView button').forEach(b => b.classList.toggle('on', b === btn));
    document.getElementById('stage').className = 'sim-' + btn.dataset.view;
});
document.getElementById('grpTheme').addEventListener('click', e => {
    const btn = e.target.closest('button'); if (!btn) return;
    document.querySelectorAll('#grpTheme button').forEach(b => b.classList.toggle('on', b === btn));
    document.body.className = 't-' + btn.dataset.theme;
});
document.getElementById('btnError').addEventListener('click', () => {
    state.phase = 'error';
    state.error = 'HTTP 401';
    render();
});
document.getElementById('btnClearDir').addEventListener('click', () => {
    state.direction = '';
    render();
});

render();
</script>
</body>
</html>
